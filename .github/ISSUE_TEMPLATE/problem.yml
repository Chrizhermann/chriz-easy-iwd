# Source: docs/releases/issue-templates/problem.yml in Chrizhermann/chriz-bg-collection.
name: Problem report
description: Something in the installer, an installation or the game does not work.
title: "[Problem] "
body:
  - type: markdown
    attributes:
      value: |
        Everything you post here is public.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the top left of the app, for example 0.1.2.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: The step or mod that failed and the error text. For a game crash, attach that crash's .log and _small.dmp files.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics ZIP
      description: In the app, use Export diagnostics, check the ZIP for anything you do not wish to share, then drag it into this field.
